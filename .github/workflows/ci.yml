name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  validate-assets:
    name: Validate Static Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for file in "Project Files"/data/*.json; do
            echo "Checking $file..."
            python3 -m json.tool "$file" > /dev/null
          done

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-and-test:
    name: Docker Build & Smoke Test
    needs: [validate-assets, lint-dockerfile]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: portfolio:ci
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Start container stack
        run: docker compose up -d

      - name: Smoke-test endpoints & assets
        run: |
          # Wait up to 30s for the container to become responsive
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              break
            fi
            sleep 2
          done

          # Test essential routes
          echo "Testing Home route..."
          curl --fail --silent http://localhost:8080/ | grep -qi '<html'

          echo "Testing About page..."
          curl --fail --silent http://localhost:8080/about.html | grep -qi 'About'

          echo "Testing Projects page..."
          curl --fail --silent http://localhost:8080/projects.html | grep -qi 'Projects'

          echo "Testing Contact page..."
          curl --fail --silent http://localhost:8080/contact.html | grep -qi 'Contact'

          echo "Testing JSON data endpoint..."
          curl --fail --silent http://localhost:8080/data/projects.json | python3 -m json.tool > /dev/null

          echo "Checking HTML references versioned assets..."
          curl --fail --silent http://localhost:8080/ | grep -qE 'assets/css/global\.css\?v=[0-9a-f]{10}"'

          echo "Checking cache headers..."
          curl --fail --silent -D - -o /dev/null http://localhost:8080/ \
            | grep -qi '^cache-control: no-cache'
          curl --fail --silent -D - -o /dev/null "http://localhost:8080/assets/css/global.css?v=test" \
            | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl --fail --silent -D - -o /dev/null http://localhost:8080/assets/css/global.css \
            | grep -qi '^cache-control: no-cache'
          curl --fail --silent -D - -o /dev/null http://localhost:8080/data/projects.json \
            | grep -qi '^cache-control: no-cache'
          curl --fail --silent -D - -o /dev/null http://localhost:8080/data/projects.json \
            | grep -qi '^etag:'

          echo "All smoke tests passed successfully!"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-image:
    name: Publish to GHCR
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
