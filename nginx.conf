# Versioned (?v=<hash>) CSS/JS can be cached forever: a content change produces
# a new URL. Anything unversioned must be revalidated on every use.
map $arg_v $asset_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    etag on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML pages and component partials: always revalidate.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control $asset_cache_control always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Data files and media keep stable names, so they are revalidated
    # (cheap 304s) rather than trusted for a fixed period.
    location ~* \.(?:json|png|jpg|jpeg|gif|svg|webp|ico|woff2?|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
