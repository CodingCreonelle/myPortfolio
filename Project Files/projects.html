<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-bind="title">Projects | Charles Portfolio</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('portfolio-theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}

        var nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
        window.__nativeFetch = nativeFetch;

        if (window.self !== window.top) {
          try {
            window.sessionStorage.removeItem('warmup_start_time');
            window.sessionStorage.removeItem('warmup_last_reload_time');
            window.sessionStorage.removeItem('warmup_failed_sent');
            window.parent.postMessage({ type: '__aistudio_warmup_succeeded' }, '*');
          } catch (e) {}

          var earlyBootstrap = null;
          var onEarlyMessage = function (event) {
            if (event && event.data && event.data.type === 'bootstrap') {
              earlyBootstrap = event;
              try {
                window.parent.postMessage({ type: '__aistudio_warmup_succeeded' }, '*');
              } catch (e) {}
            }
          };
          window.addEventListener('message', onEarlyMessage);

          window.addEventListener('DOMContentLoaded', function () {
            window.removeEventListener('message', onEarlyMessage);
            try {
              window.parent.postMessage({ type: '__aistudio_warmup_succeeded' }, '*');
            } catch (e) {}
            if (earlyBootstrap) {
              var ev = earlyBootstrap;
              earlyBootstrap = null;
              try {
                window.dispatchEvent(new MessageEvent('message', {
                  data: ev.data,
                  origin: ev.origin,
                  ports: ev.ports
                }));
              } catch (e) {}
            }
          });

          if (nativeFetch && typeof Object.defineProperty === 'function') {
            var origDefineProperty = Object.defineProperty;
            Object.defineProperty = function (obj, prop, descriptor) {
              if (obj === window && prop === 'fetch' && descriptor && typeof descriptor.get === 'function') {
                var origGetter = descriptor.get;
                return origDefineProperty.call(Object, obj, prop, {
                  configurable: true,
                  enumerable: true,
                  get: function () {
                    var iframeFetch = origGetter.call(this);
                    return function (resource, options) {
                      try {
                        var urlStr = typeof resource === 'string'
                          ? resource
                          : (resource && typeof resource.url === 'string' ? resource.url : String(resource));
                        var resolved = new URL(urlStr, window.location.href);
                        if (resolved.origin === window.location.origin) {
                          return nativeFetch(resource, options);
                        }
                      } catch (e) {
                        return nativeFetch(resource, options);
                      }
                      return iframeFetch.call(this, resource, options);
                    };
                  }
                });
              }
              return origDefineProperty.apply(Object, arguments);
            };
          }
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/icons/rm373batch2-27-removebg-preview.png">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/projects.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/typewriter.css">
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/utils.js" defer></script>
    <script src="assets/js/content.js" defer></script>
    <script src="assets/js/app-loader.js" defer></script>
    <script src="assets/js/admin-menu.js" defer></script>
    <script src="assets/js/data-loader.js" defer></script>
    <script src="assets/js/typewriter.js" defer></script>
    <script src="assets/js/animation-observer.js" defer></script>
</head>
<body>
    <div id="site-background"></div>
    <div id="site-navbar"></div>

    <main class="projects-page">
        <section class="page-hero" data-animate="animate-entrance" data-animate-delay="0" data-animate-replay="true">
            <div class="page-title">
                <p class="eyebrow" data-bind="hero.eyebrow">Projects</p>
                <h1 data-typewriter data-bind="hero.title">Complete project showcase</h1>
                <p data-bind="hero.body">Explore a curated list of portfolio projects, demos, and live experiences.</p>
            </div>
            <div class="page-actions" data-list="hero.actions" data-list-template="tpl-action"></div>
        </section>

        <section class="project-list" id="project-list" data-animate="animate-entrance" data-animate-replay="true" data-animate-stagger="true" data-animate-stagger-delay="100" data-animate-delay="200"></section>
    </main>

    <!-- Repeated-action template: used by the page hero button row. -->
    <template id="tpl-action">
        <a data-bind-class="className" data-bind-href="href" data-bind="label"></a>
    </template>

    <div id="site-footer"></div>
</body>
</html>
