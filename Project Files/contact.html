<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Charles Portfolio</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/homepage.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <script src="assets/js/app-loader.js" defer></script>
    <script src="assets/js/data-loader.js" defer></script>
    <script src="assets/js/live-reload.js" defer></script>
    <script src="assets/js/animation-observer.js" defer></script>
</head>
<body>
    <div id="site-navbar"></div>

    <main class="contact-page">
        <section class="page-hero" data-animate="animate-entrance" data-animate-delay="0">
            <div class="page-title">
                <p class="eyebrow">Contact</p>
                <h1>Let’s connect</h1>
                <p>Questions, project requests, or collaboration ideas? Reach out and I’ll get back to you soon.</p>
            </div>
        </section>

        <section class="contact-overview" data-animate="animate-entrance" data-animate-delay="200">
            <div class="contact-cards animate-stagger" id="contact-cards" data-animate-stagger="true" data-animate-stagger-delay="100"></div>
        </section>

        <section class="contact-form-section" data-animate="animate-entrance" data-animate-delay="200">
            <div class="section-header section-header-animate">
                <p class="section-label">Send a message</p>
                <h2>Contact form</h2>
            </div>
            <form class="contact-form" action="#" method="post">
                <label>
                    Name
                    <input type="text" name="name" placeholder="Your name" required>
                </label>
                <label>
                    Email
                    <input type="email" name="email" placeholder="you@example.com" required>
                </label>
                <label>
                    Message
                    <textarea name="message" rows="6" placeholder="Tell me about your project or question"></textarea>
                </label>
                <button type="submit" class="button button-primary">Send message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p>© 2026 Charles. Looking forward to your next project.</p>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
            </div>
        </div>
    </footer>
</body>
</html>
